name: Test game and Qollab delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: game-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python and the shipped bundle
        run: |
          python -m pip check
          python -m unittest discover -s tests -v
          python build_qollab.py --check --verify-zip QOLLAB_0.2.4.zip
      - name: Check JavaScript syntax
        run: |
          for module in *.js; do node --check "$module"; done
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Exercise interface, slides, practice, privacy, audio and animations
        env:
          ARTIFACT_DIR: /tmp/qriollo-browser-tests
        run: |
          python serve.py > /tmp/qriollo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000') as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise RuntimeError('Local game did not start')
          PY
          node tests/browser_interface.cjs
          node tests/browser_full_match.cjs
          TRUCO_PRIVACY=1 node tests/browser_full_match.cjs
          node tests/browser_animations.cjs
          node tests/browser_settings.cjs
          node tests/browser_slides.cjs
          node tests/browser_tutorial.cjs
          TRUCO_LANG=en node tests/browser_tutorial.cjs
      - name: Keep browser evidence and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            /tmp/qriollo-browser-tests
            /tmp/qriollo-server.log
